<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #1b2a4a; }
      .region { fill: #f7f9fc; stroke: #9aa8c0; stroke-width: 1.5; }
      .rtitle { font-size: 15px; font-weight: 700; fill: #1b2a4a; }
      .rsub { font-size: 12px; fill: #4a5568; }
      .st { fill: #ffffff; stroke: #2f5597; stroke-width: 2; }
      .ok { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .bad { fill: #fdecea; stroke: #b3261e; stroke-width: 2; }
      .sn { font-size: 14px; font-weight: 700; fill: #111; }
      .sd { font-size: 11.5px; fill: #333; }
      .ev { font-size: 11.5px; fill: #111; }
      .evr { font-size: 11.5px; fill: #b3261e; }
      .ln { stroke: #333; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .lr { stroke: #b3261e; stroke-width: 1.6; fill: none; marker-end: url(#r); stroke-dasharray: 5 4; }
      .note { font-size: 11.5px; fill: #333; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="620" fill="#ffffff"/>
  <text x="20" y="32" class="title">Buddy 1 - Communication subsystem statechart (Radio Service Task)</text>

  <!-- ===================== Region 1: WiFi link ===================== -->
  <rect x="20" y="50" width="490" height="500" rx="10" class="region"/>
  <text x="36" y="74" class="rtitle">A. WiFi link (cyw43_utk.c)</text>
  <text x="36" y="92" class="rsub">Runs every radio poll (2 ms loop, 10 ms kernel tick)</text>

  <circle cx="265" cy="118" r="7" fill="#111"/>
  <path d="M265,125 L265,142" class="ln"/>

  <rect x="165" y="144" width="200" height="56" rx="10" class="st"/>
  <text x="265" y="166" class="sn" text-anchor="middle">JOINING</text>
  <text x="265" y="184" class="sd" text-anchor="middle">scan, then WPA2 join (boot)</text>

  <rect x="165" y="262" width="200" height="66" rx="10" class="ok"/>
  <text x="265" y="284" class="sn" text-anchor="middle">CONNECTED</text>
  <text x="265" y="301" class="sd" text-anchor="middle">link up; DHCP lease</text>
  <text x="265" y="317" class="sd" text-anchor="middle">RSSI read every 5 s</text>

  <rect x="40" y="410" width="200" height="66" rx="10" class="bad"/>
  <text x="140" y="432" class="sn" text-anchor="middle">LINK_LOST</text>
  <text x="140" y="449" class="sd" text-anchor="middle">radio firmware retries</text>
  <text x="140" y="465" class="sd" text-anchor="middle">on its own (up to 20 s)</text>

  <rect x="290" y="410" width="200" height="82" rx="10" class="bad"/>
  <text x="390" y="432" class="sn" text-anchor="middle">REJOINING</text>
  <text x="390" y="449" class="sd" text-anchor="middle">cyw43_wifi_join() again</text>
  <text x="390" y="465" class="sd" text-anchor="middle">wait 2 s, 5, 10, 15 s (cap)</text>
  <text x="390" y="481" class="sd" text-anchor="middle">counted: losses / attempts</text>

  <!-- JOINING -> CONNECTED -->
  <path d="M265,200 L265,260" class="ln"/>
  <text x="257" y="228" class="ev" text-anchor="end">link up</text>
  <text x="257" y="243" class="ev" text-anchor="end">(netif link callback)</text>
  <!-- JOINING -> REJOINING (fail) -->
  <path d="M365,180 C495,185 500,320 450,408" class="lr"/>
  <text x="290" y="226" class="evr">join failed / 30 s</text>
  <text x="290" y="241" class="evr">(AP off at boot)</text>
  <!-- CONNECTED -> LINK_LOST -->
  <path d="M205,328 L160,408" class="lr"/>
  <text x="193" y="372" class="evr">link down</text>
  <text x="193" y="387" class="evr">(AP gone)</text>
  <!-- LINK_LOST -> CONNECTED -->
  <path d="M115,408 C80,350 120,300 163,292" class="ln"/>
  <text x="30" y="300" class="ev">firmware</text>
  <text x="30" y="314" class="ev">re-associates</text>
  <!-- LINK_LOST -> REJOINING -->
  <path d="M240,452 L288,452" class="lr"/>
  <text x="243" y="505" class="evr">20 s without</text>
  <text x="243" y="519" class="evr">link / disassoc</text>
  <!-- REJOINING -> CONNECTED -->
  <path d="M360,408 L320,330" class="ln"/>
  <text x="345" y="366" class="ev">link up</text>
  <!-- REJOINING self loop -->
  <path d="M490,440 C530,430 530,470 492,470" class="lr"/>
  <text x="500" y="520" class="evr" text-anchor="end">not found (-2):</text><text x="500" y="534" class="evr" text-anchor="end">retry</text>

  <!-- ===================== Region 2: MQTT session ===================== -->
  <rect x="530" y="50" width="490" height="500" rx="10" class="region"/>
  <text x="546" y="74" class="rtitle">B. MQTT session (lwip_utk_mqtt.c)</text>
  <text x="546" y="92" class="rsub">Checks link + IP address itself on every poll</text>

  <circle cx="775" cy="118" r="7" fill="#111"/>
  <path d="M775,125 L775,142" class="ln"/>

  <rect x="675" y="144" width="200" height="56" rx="10" class="st"/>
  <text x="775" y="166" class="sn" text-anchor="middle">IDLE</text>
  <text x="775" y="184" class="sd" text-anchor="middle">waiting for link + IP</text>

  <rect x="675" y="246" width="200" height="56" rx="10" class="st"/>
  <text x="775" y="268" class="sn" text-anchor="middle">CONNECTING</text>
  <text x="775" y="286" class="sd" text-anchor="middle">TCP + MQTT CONNECT (LWT set)</text>

  <rect x="660" y="350" width="230" height="86" rx="10" class="ok"/>
  <text x="775" y="372" class="sn" text-anchor="middle">CONNECTED</text>
  <text x="775" y="389" class="sd" text-anchor="middle">publish status=online (retained)</text>
  <text x="775" y="405" class="sd" text-anchor="middle">subscribe robot/command</text>
  <text x="775" y="421" class="sd" text-anchor="middle">every 20 ms: publish up to 4 msgs</text>

  <rect x="560" y="470" width="210" height="66" rx="10" class="bad"/>
  <text x="665" y="492" class="sn" text-anchor="middle">BACKOFF</text>
  <text x="665" y="509" class="sd" text-anchor="middle">wait 1, 2, 4 ... 30 s (cap)</text>
  <text x="665" y="525" class="sd" text-anchor="middle">events keep queuing (16)</text>

  <!-- IDLE -> CONNECTING -->
  <path d="M775,200 L775,244" class="ln"/>
  <text x="783" y="228" class="ev">link up and IP != 0.0.0.0</text>
  <!-- CONNECTING -> CONNECTED -->
  <path d="M775,302 L775,348" class="ln"/>
  <text x="783" y="330" class="ev">CONNACK accepted</text>
  <!-- CONNECTING -> BACKOFF -->
  <path d="M675,280 C600,300 590,420 620,468" class="lr"/>
  <text x="546" y="330" class="evr">refused /</text>
  <text x="546" y="345" class="evr">~9 s timeout</text>
  <!-- CONNECTED -> BACKOFF -->
  <path d="M700,436 L690,468" class="lr"/>
  <text x="708" y="459" class="evr">link down / broker lost</text>
  <!-- BACKOFF -> CONNECTING -->
  <path d="M770,500 C900,490 930,300 877,280" class="ln"/>
  <text x="905" y="455" class="ev">wait over, or</text>
  <text x="905" y="470" class="ev">network just</text>
  <text x="905" y="485" class="ev">came back</text>

  <!-- ===================== Notes ===================== -->
  <text x="20" y="572" class="note">Both machines run inside the Radio Service Task only and never block it; other tasks read state through a seqlock snapshot.</text>
  <text x="20" y="590" class="note">While not CONNECTED, telemetry is not sent (latest values resent on reconnect); events wait in the 16-slot queue or are counted in ev_drop.</text>
  <text x="20" y="608" class="note">The broker publishes robot/status = offline (last will) when the session is lost; commands never move the car (start / stop / status only).</text>
</svg>
